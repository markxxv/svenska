  {id:1,text:'Hej!',translation:'Привет!',topic:'Базовые фразы',words:[['Hej','hej','привет','Обычное нейтральное приветствие.']]},
  {id:2,text:'Hur är det?',translation:'Как дела?',topic:'Базовые фразы',words:[['Hur','hur','как'],['är','vara','есть / обстоят'],['det','det','это / дела','Вся конструкция "Hur är det?" — обычное «Как дела?».','Hur är det?','Как дела?']]},
  {id:3,text:'Tack så mycket.',translation:'Большое спасибо.',topic:'Базовые фразы',words:[['Tack','tack','спасибо'],['så','så','так / настолько'],['mycket','mycket','много','Вместе: "tack så mycket" — «большое спасибо».','tack så mycket','большое спасибо']]},
  {id:4,text:'Varsågod.',translation:'Пожалуйста.',topic:'Базовые фразы',words:[['Varsågod','varsågod','пожалуйста','Говорят, когда что-то дают или отвечают на благодарность.']]},
  {id:5,text:'Ursäkta.',translation:'Извините.',topic:'Базовые фразы',words:[['Ursäkta','ursäkta','извините','Подходит, чтобы привлечь внимание или извиниться.']]},
  {id:6,text:'Ingen fara.',translation:'Ничего страшного.',topic:'Базовые фразы',words:[['Ingen','ingen','никакой / нет'],['fara','fara','опасность / проблема','Устойчивая фраза: «ничего страшного», «без проблем».','ingen fara','ничего страшного']]},
  {id:7,text:'Jag förstår inte.',translation:'Я не понимаю.',topic:'Общение',words:[['Jag','jag','я'],['förstår','förstå','понимаю'],['inte','inte','не','В простом главном предложении отрицание обычно стоит после глагола.']]},
  {id:8,text:'Kan du säga det igen?',translation:'Можешь повторить?',topic:'Общение',words:[['Kan','kunna','можешь'],['du','du','ты'],['säga','säga','сказать'],['det','det','это'],['igen','igen','снова / ещё раз','"säga det igen" — сказать это ещё раз.','säga det igen','повторить / сказать ещё раз']]},
  {id:9,text:'Kan du prata lite långsammare?',translation:'Можешь говорить немного медленнее?',topic:'Общение',words:[['Kan','kunna','можешь'],['du','du','ты'],['prata','prata','говорить'],['lite','lite','немного'],['långsammare','långsam','медленнее']]},
  {id:10,text:'Vad betyder det?',translation:'Что это значит?',topic:'Общение',words:[['Vad','vad','что'],['betyder','betyda','значит / означает'],['det','det','это']]},
  {id:11,text:'Var ligger toaletten?',translation:'Где туалет?',topic:'В городе',words:[['Var','var','где'],['ligger','ligga','находится','Глагол "ligga" часто используют о местонахождении места или объекта.'],['toaletten','toalett','туалет','Определённая форма: "toaletten" — «этот / конкретный туалет».']]},
  {id:12,text:'Hur mycket kostar det?',translation:'Сколько это стоит?',topic:'Покупки',words:[['Hur','hur','как'],['mycket','mycket','много / сколько','"hur mycket" — «сколько».','hur mycket','сколько'],['kostar','kosta','стоит'],['det','det','это']]},
  {id:13,text:'Kan jag betala med kort?',translation:'Можно оплатить картой?',topic:'Покупки',words:[['Kan','kunna','могу / можно'],['jag','jag','я'],['betala','betala','платить / оплатить'],['med','med','с / при помощи'],['kort','kort','карта','"med kort" — картой.','betala med kort','платить картой']]},
  {id:14,text:'Jag skulle vilja ha en kaffe, tack.',translation:'Я бы хотел кофе, пожалуйста.',topic:'Кафе',words:[['Jag','jag','я'],['skulle','skola','бы','Здесь часть вежливой конструкции "skulle vilja" — «хотел бы».','skulle vilja','хотел бы'],['vilja','vilja','хотеть','Вместе со "skulle" образует вежливое желание.','skulle vilja','хотел бы'],['ha','ha','иметь / получить','После "skulle vilja": что именно вы хотели бы получить.'],['en','en','неопределённый артикль'],['kaffe','kaffe','кофе'],['tack','tack','пожалуйста','В конце просьбы "tack" звучит как вежливое «пожалуйста».']]},
  {id:15,text:'Kan jag få notan, tack?',translation:'Можно счёт, пожалуйста?',topic:'Кафе',words:[['Kan','kunna','можно / могу'],['jag','jag','я'],['få','få','получить','Конструкция "Kan jag få…?" — естественный способ что-то попросить.','Kan jag få…?','Можно мне…?'],['notan','nota','счёт','Определённая форма слова "nota".'],['tack','tack','пожалуйста']]},
  {id:16,text:'Jag letar efter den här adressen.',translation:'Я ищу этот адрес.',topic:'В городе',words:[['Jag','jag','я'],['letar','leta','ищу','Глагол часто используется с "efter".','leta efter','искать'],['efter','efter','за / после','Здесь часть конструкции "leta efter" — «искать».','leta efter','искать'],['den','den','этот'],['här','här','здесь','"den här" — «этот / эта».','den här','этот / эта'],['adressen','adress','адрес']]},
  {id:17,text:'Vilken buss ska jag ta?',translation:'На какой автобус мне сесть?',topic:'Транспорт',words:[['Vilken','vilken','какой'],['buss','buss','автобус'],['ska','skola','нужно / следует','Здесь "ska jag" передаёт «мне нужно / следует».'],['jag','jag','я'],['ta','ta','взять / сесть на','С транспортом "ta" часто значит «поехать на / сесть на».']]},
  {id:18,text:'När går nästa tåg?',translation:'Когда следующий поезд?',topic:'Транспорт',words:[['När','när','когда'],['går','gå','идёт / отправляется','О транспорте "går" часто значит «отправляется».'],['nästa','nästa','следующий'],['tåg','tåg','поезд']]},
  {id:19,text:'Jag vet inte.',translation:'Я не знаю.',topic:'Базовые фразы',words:[['Jag','jag','я'],['vet','veta','знаю'],['inte','inte','не']]},
  {id:20,text:'Vi ses senare.',translation:'Увидимся позже.',topic:'Базовые фразы',words:[['Vi','vi','мы'],['ses','ses','увидимся','Возвратная форма: буквально «мы увидимся».'],['senare','sen','позже']]},
  {id:21,text:'Jag har bott här i tre år.',translation:'Я живу здесь уже три года.',topic:'О себе',words:[['Jag','jag','я'],['har','ha','имею / вспомогательный глагол'],['bott','bo','жил / живу','"har bott" — действие началось раньше и связано с настоящим.','har bott','живу / жил до настоящего момента'],['här','här','здесь'],['i','i','в / на протяжении'],['tre','tre','три'],['år','år','года']]},
  {id:22,text:'Jag tänkte gå och handla efter jobbet.',translation:'Я собирался зайти за покупками после работы.',topic:'Планы',words:[['Jag','jag','я'],['tänkte','tänka','думал / собирался','В разговоре "jag tänkte…" часто мягко сообщает о плане.','jag tänkte…','я собирался / я думал…'],['gå','gå','идти'],['och','och','и'],['handla','handla','делать покупки'],['efter','efter','после'],['jobbet','jobb','работы','Определённая форма: "jobbet" — «работа / рабочий день».']]},
  {id:23,text:'Om du vill kan vi ses senare.',translation:'Если хочешь, можем встретиться позже.',topic:'Планы',words:[['Om','om','если'],['du','du','ты'],['vill','vilja','хочешь'],['kan','kunna','можем'],['vi','vi','мы'],['ses','ses','встретиться / увидеться'],['senare','sen','позже']]},
  {id:24,text:'Jag vet inte om jag hinner idag.',translation:'Я не знаю, успею ли я сегодня.',topic:'Планы',words:[['Jag','jag','я'],['vet','veta','знаю'],['inte','inte','не'],['om','om','ли','После "jag vet inte" слово "om" вводит косвенный вопрос.','vet inte om…','не знаю, … ли'],['jag','jag','я'],['hinner','hinna','успею','"hinna" — успеть сделать что-то за имеющееся время.'],['idag','idag','сегодня']]},
  {id:25,text:'Det beror på hur mycket tid vi har.',translation:'Это зависит от того, сколько у нас времени.',topic:'Повседневная речь',words:[['Det','det','это'],['beror','bero','зависит','Используется с предлогом "på".','beror på','зависит от'],['på','på','от','Часть конструкции "beror på".','beror på','зависит от'],['hur','hur','как'],['mycket','mycket','много / сколько','"hur mycket" — «сколько».','hur mycket','сколько'],['tid','tid','времени'],['vi','vi','мы'],['har','ha','имеем / у нас есть']]},
  {id:26,text:'Jag måste gå nu, annars blir jag sen.',translation:'Мне нужно идти, иначе я опоздаю.',topic:'Повседневная речь',words:[['Jag','jag','я'],['måste','måste','должен / нужно'],['gå','gå','идти'],['nu','nu','сейчас'],['annars','annars','иначе'],['blir','bli','стану / окажусь'],['jag','jag','я'],['sen','sen','поздно / опоздавший','"bli sen" — опоздать.','bli sen','опоздать']]},
  {id:27,text:'När jag kommer hem ska jag laga middag.',translation:'Когда я приду домой, я приготовлю ужин.',topic:'Дом',words:[['När','när','когда'],['jag','jag','я'],['kommer','komma','прихожу / приду'],['hem','hem','домой'],['ska','skola','буду / собираюсь'],['jag','jag','я'],['laga','laga','готовить'],['middag','middag','ужин']]},
  {id:28,text:'Jag har redan gjort det.',translation:'Я уже это сделал.',topic:'Повседневная речь',words:[['Jag','jag','я'],['har','ha','вспомогательный глагол'],['redan','redan','уже'],['gjort','göra','сделал','"har gjort" — «сделал / уже сделал».','har gjort','сделал'],['det','det','это']]},
  {id:29,text:'Jag har aldrig varit där förut.',translation:'Я никогда раньше там не был.',topic:'Опыт',words:[['Jag','jag','я'],['har','ha','вспомогательный глагол'],['aldrig','aldrig','никогда'],['varit','vara','был','"har varit" — «был / бывал».','har varit','был / бывал'],['där','där','там'],['förut','förut','раньше / прежде']]},
  {id:30,text:'Jag skulle gärna följa med.',translation:'Я бы с удовольствием пошёл с вами.',topic:'Планы',words:[['Jag','jag','я'],['skulle','skola','бы'],['gärna','gärna','с удовольствием','"skulle gärna" — «с удовольствием бы».','skulle gärna','с удовольствием бы'],['följa','följa','следовать / пойти'],['med','med','с','"följa med" — пойти вместе / присоединиться.','följa med','пойти вместе / присоединиться']]},
  {id:31,text:'Kan du hjälpa mig att hitta rätt?',translation:'Можешь помочь мне найти нужное место?',topic:'В городе',words:[['Kan','kunna','можешь'],['du','du','ты'],['hjälpa','hjälpa','помочь'],['mig','jag','мне'],['att','att','частица инфинитива'],['hitta','hitta','найти'],['rätt','rätt','правильно / нужное','"hitta rätt" — найти правильный путь или нужное место.','hitta rätt','найти нужное место / путь']]},
  {id:32,text:'Jag försöker lära mig svenska.',translation:'Я стараюсь выучить шведский.',topic:'Обучение',words:[['Jag','jag','я'],['försöker','försöka','стараюсь / пытаюсь'],['lära','lära','учить'],['mig','jag','себя / мне','"lära mig" — учиться / выучить для себя.','lära mig','учиться / выучить'],['svenska','svenska','шведский язык']]},

const state = {
  index: Math.max(0, Math.min(phrases.length - 1, Number(localStorage.getItem('sv-index') || 0))),
  favorites: new Set(JSON.parse(localStorage.getItem('sv-favorites') || '[]')),
  translationVisible: false,
  slow: false,
  selectedWord: null
};

const $ = (id) => document.getElementById(id);
const wordsEl = $('words');
const translationCard = $('translationCard');
const translationText = $('translationText');
const counter = $('counter');
const topicLabel = $('topicLabel');
const progressBar = $('progressBar');
const favoriteText = $('favoriteText');
const waveform = $('waveform');

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, (char) => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[char]));
}

function punctuationFor(phraseText, wordText, occurrenceIndex) {
  const escaped = wordText.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  const matches = [...phraseText.matchAll(new RegExp(`\\b${escaped}([,?.!;:]?)`, 'gi'))];
  return matches[occurrenceIndex]?.[1] || '';
}

function renderWaveform() {
  const bars = [10,16,22,13,26,18,31,20,15,28,34,23,18,27,15,11,20,13];
  waveform.innerHTML = bars.map((h, i) => `<span class="wavebar block w-[3px] rounded-full bg-zinc-300 transition-all duration-200" style="height:${h}px"></span>`).join('');
}

function renderPhrase() {
  stopSpeech();
  state.translationVisible = false;
  translationCard.classList.add('hidden');
  const phrase = phrases[state.index];
  counter.textContent = `${state.index + 1} / ${phrases.length}`;
  topicLabel.textContent = phrase.topic;
  progressBar.style.width = `${((state.index + 1) / phrases.length) * 100}%`;
  translationText.textContent = phrase.translation;
  wordsEl.innerHTML = '';

  const seen = {};
  phrase.words.forEach((word, wordIndex) => {
    const [surface] = word;
    const key = surface.toLowerCase();
    const occurrence = seen[key] || 0;
    seen[key] = occurrence + 1;
    const suffix = punctuationFor(phrase.text, surface, occurrence);
    const button = document.createElement('button');
    button.className = 'word-chip';
    button.innerHTML = `${escapeHtml(surface)}${escapeHtml(suffix)}`;
    button.addEventListener('click', () => openWordSheet(wordIndex));
    wordsEl.appendChild(button);
  });

  const isFav = state.favorites.has(phrase.id);
  favoriteText.textContent = isFav ? 'В избранном' : 'В избранное';
  const favIcon = $('favoriteIcon');
  if (favIcon) favIcon.setAttribute('fill', isFav ? 'currentColor' : 'none');
  $('backBtn').classList.toggle('opacity-30', state.index === 0);
  $('backBtn').disabled = state.index === 0;
  localStorage.setItem('sv-index', String(state.index));
  lucide.createIcons();
}

function chooseSwedishVoice() {
  const voices = speechSynthesis.getVoices();
  const swedish = voices.filter(v => /^sv(-|_)/i.test(v.lang));
  return swedish.find(v => /siri|alva|klara|google|microsoft/i.test(v.name)) || swedish[0] || null;
}

function speak(text, rate = 0.92, onEnd = null) {
  if (!('speechSynthesis' in window)) {
    alert('Этот браузер не поддерживает Web Speech API.');
    return;
  }
  stopSpeech();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = 'sv-SE';
  utterance.rate = rate;
  utterance.pitch = 1;
  const voice = chooseSwedishVoice();
  if (voice) utterance.voice = voice;
  utterance.onstart = () => setSpeaking(true);
  utterance.onend = () => { setSpeaking(false); if (onEnd) onEnd(); };
  utterance.onerror = () => setSpeaking(false);
  speechSynthesis.speak(utterance);
}

function stopSpeech() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  setSpeaking(false);
}

function setSpeaking(active) {
  document.querySelectorAll('.wavebar').forEach((bar, i) => {
    bar.style.transform = active ? `scaleY(${[1.2,.75,1.45,.9,1.3][i % 5]})` : 'scaleY(1)';
    bar.classList.toggle('bg-black', active);
  });
  $('playPhraseBtn').classList.toggle('scale-95', active);
}

function openWordSheet(wordIndex) {
  const phrase = phrases[state.index];
  const word = phrase.words[wordIndex];
  const [surface, lemma, translation, note, chunk, chunkTranslation] = word;
  state.selectedWord = word;
  $('sheetWord').textContent = surface;
  $('sheetLemma').textContent = lemma && lemma.toLowerCase() !== surface.toLowerCase() ? `lemma: ${lemma}` : 'слово в текущей форме';
  $('sheetTranslation').textContent = translation;
  $('sheetNote').textContent = note || '';
  $('sheetNoteWrap').classList.toggle('hidden', !note);
  $('sheetChunk').textContent = chunk || '';
  $('sheetChunkTranslation').textContent = chunkTranslation || '';
  $('sheetChunkWrap').classList.toggle('hidden', !chunk);
  $('sheetBackdrop').classList.remove('hidden');
  $('wordSheet').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  lucide.createIcons();
}

function closeWordSheet() {
  $('sheetBackdrop').classList.add('hidden');
  $('wordSheet').classList.add('hidden');
  document.body.style.overflow = '';
  state.selectedWord = null;
}

function nextPhrase() {
  if (state.index < phrases.length - 1) state.index += 1;
  else state.index = 0;
  renderPhrase();
}

function previousPhrase() {
  if (state.index > 0) state.index -= 1;
  renderPhrase();
}

function toggleFavorite() {
  const id = phrases[state.index].id;
  if (state.favorites.has(id)) state.favorites.delete(id); else state.favorites.add(id);
  localStorage.setItem('sv-favorites', JSON.stringify([...state.favorites]));
  renderPhrase();
}

function openFavorites() {
  const items = phrases.filter(p => state.favorites.has(p.id));
  $('favoritesCount').textContent = `${items.length} ${items.length === 1 ? 'фраза' : items.length >= 2 && items.length <= 4 ? 'фразы' : 'фраз'}`;
  $('favoritesList').innerHTML = items.length ? items.map(p => `<button class="favorite-row w-full rounded-2xl bg-white p-4 text-left ring-1 ring-zinc-200/70" data-id="${p.id}"><div class="text-[17px] font-semibold tracking-[-0.02em]">${escapeHtml(p.text)}</div><div class="mt-1 text-[13px] leading-relaxed text-zinc-500">${escapeHtml(p.translation)}</div></button>`).join('') : `<div class="rounded-3xl border border-dashed border-zinc-300 p-8 text-center"><div class="mx-auto flex h-12 w-12 items-center justify-center rounded-full bg-zinc-100"><i data-lucide="heart" class="h-5 w-5 text-zinc-400"></i></div><div class="mt-4 text-[15px] font-semibold">Пока пусто</div><div class="mt-1 text-[13px] leading-relaxed text-zinc-400">Добавляйте полезные фразы сердечком.</div></div>`;
  document.querySelectorAll('.favorite-row').forEach(btn => btn.addEventListener('click', () => {
    const id = Number(btn.dataset.id);
    state.index = phrases.findIndex(p => p.id === id);
    closeFavorites();
    renderPhrase();
  }));
  $('favoritesPanel').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
  lucide.createIcons();
}

function closeFavorites() {
  $('favoritesPanel').classList.add('hidden');
  document.body.style.overflow = '';
}

$('playPhraseBtn').addEventListener('click', () => speak(phrases[state.index].text, state.slow ? 0.78 : 0.95));
$('slowBtn').addEventListener('click', () => { state.slow = !state.slow; $('slowBtn').textContent = state.slow ? '0.8×' : '1×'; });
$('translateBtn').addEventListener('click', () => { state.translationVisible = !state.translationVisible; translationCard.classList.toggle('hidden', !state.translationVisible); });
$('favoriteBtn').addEventListener('click', toggleFavorite);
$('nextBtn').addEventListener('click', nextPhrase);
$('backBtn').addEventListener('click', previousPhrase);
$('sheetBackdrop').addEventListener('click', closeWordSheet);
$('closeSheetBtn').addEventListener('click', closeWordSheet);
$('playWordBtn').addEventListener('click', () => { if (state.selectedWord) speak(state.selectedWord[0], 0.82); });
$('favoritesTab').addEventListener('click', openFavorites);
$('closeFavoritesBtn').addEventListener('click', closeFavorites);
$('lessonsTab').addEventListener('click', () => {});
$('resetBtn').addEventListener('click', () => { state.index = 0; renderPhrase(); });

let touchStartX = 0;
let touchStartY = 0;
document.querySelector('main').addEventListener('touchstart', (e) => { touchStartX = e.changedTouches[0].screenX; touchStartY = e.changedTouches[0].screenY; }, {passive:true});
document.querySelector('main').addEventListener('touchend', (e) => {
  if (!$('wordSheet').classList.contains('hidden')) return;
  const dx = e.changedTouches[0].screenX - touchStartX;
  const dy = e.changedTouches[0].screenY - touchStartY;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 1.5) dx < 0 ? nextPhrase() : previousPhrase();
}, {passive:true});

renderWaveform();
renderPhrase();
if ('speechSynthesis' in window) {
  speechSynthesis.getVoices();
  speechSynthesis.onvoiceschanged = () => chooseSwedishVoice();
}
</script>
</body>
</html>
