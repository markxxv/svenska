name: Update content catalogs
on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'scripts/sync-content.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build catalogs
        run: node scripts/sync-content.mjs
      - name: Commit updated indexes
        run: |
          if ! git diff --quiet -- data/index.json data/dictionaries/index.json data/phrases/index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/index.json data/dictionaries/index.json data/phrases/index.json
            git commit -m "chore: refresh content catalogs"
            git push
          fi
