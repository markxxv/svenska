<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafafa">
  <title>Svenska — шведский для жизни</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style type="text/tailwindcss">
    @theme { --font-sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    @layer base {
      html { -webkit-tap-highlight-color: transparent; }
      body { @apply bg-zinc-100 text-zinc-950 antialiased; }
      button { touch-action: manipulation; }
    }
    @layer utilities {
      .safe-top { padding-top: max(18px, env(safe-area-inset-top)); }
      .safe-bottom { padding-bottom: max(12px, env(safe-area-inset-bottom)); }
      .phone-shadow { box-shadow: 0 24px 80px rgba(0,0,0,.08); }
      .chip { @apply inline-flex min-h-10 items-center gap-1.5 rounded-xl bg-zinc-100 px-3.5 text-[13px] font-medium text-zinc-700 transition active:scale-[.98]; }
      .primary { @apply inline-flex min-h-13 items-center justify-center gap-2 rounded-2xl bg-zinc-950 px-5 text-[14px] font-semibold text-white transition active:scale-[.98]; }
      .surface { @apply rounded-[26px] bg-white p-5 shadow-[0_10px_36px_rgba(0,0,0,.035)]; }
      .ghost { @apply inline-flex min-h-12 items-center justify-center gap-2 rounded-2xl bg-zinc-100 px-4 text-[14px] font-semibold text-zinc-700 transition active:scale-[.98]; }
      .word-chip { @apply rounded-2xl bg-zinc-100 px-4 py-3.5 text-[19px] font-medium leading-none tracking-tight transition active:scale-[.97] active:bg-zinc-200; }
      .flip-card { perspective: 1200px; }
      .flip-inner { transform-style: preserve-3d; transition: transform .45s ease; }
      .flip-card.is-flipped .flip-inner { transform: rotateY(180deg); }
      .flip-face { backface-visibility: hidden; -webkit-backface-visibility: hidden; }
      .flip-back { transform: rotateY(180deg); }
      .scrollbar-none { scrollbar-width:none; }
      .scrollbar-none::-webkit-scrollbar { display:none; }
    }
  </style>
</head>
<body>
  <div class="min-h-screen md:flex md:items-center md:justify-center md:p-8">
    <main class="mx-auto flex h-dvh min-h-[550px] w-full max-w-[430px] flex-col overflow-hidden bg-[#fafafa] md:h-[860px] md:rounded-[34px] md:phone-shadow">
      <header class="safe-top shrink-0 px-5 pb-3">
        <div class="flex items-center gap-3">
          <a href="#/" id="backButton" class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white text-zinc-700" aria-label="Назад"><i data-lucide="arrow-left" class="h-5 w-5"></i></a>
          <div class="min-w-0 flex-1">
            <h1 id="headerTitle" class="truncate text-[17px] font-semibold tracking-tight">Svenska</h1>
            <p id="headerSubtitle" class="truncate text-[12px] text-zinc-500">Шведский для реальной жизни</p>
          </div>
          <div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-full bg-white text-lg" aria-hidden="true">🇸🇪</div>
        </div>
        <nav id="stageNav" class="scrollbar-none mt-4 hidden gap-1.5 overflow-x-auto pb-1" aria-label="Этапы урока"></nav>
      </header>
      <div id="view" class="min-h-0 flex-1 overflow-y-auto px-5 pb-7" aria-live="polite">
        <div class="pt-12 text-center text-sm text-zinc-400">Загружаем материалы…</div>
      </div>
      <nav id="bottomNav" aria-label="Основная навигация" class="safe-bottom grid shrink-0 grid-cols-4 border-t border-zinc-100 bg-white px-4 pt-2">
        <a data-nav="home" href="#/" class="flex min-h-[55px] flex-col items-center justify-center gap-1 rounded-2xl text-zinc-400 transition-colors">
          <i data-lucide="house" class="h-[21px] w-[21px]"></i><span class="text-[11px] font-medium">Главная</span>
        </a>
        <a data-nav="dictionaries" href="#/dictionaries" class="flex min-h-[55px] flex-col items-center justify-center gap-1 rounded-2xl text-zinc-400 transition-colors">
          <i data-lucide="book-open" class="h-[21px] w-[21px]"></i><span class="text-[11px] font-medium">Словари</span>
        </a>
        <a data-nav="phrases" href="#/phrases" class="flex min-h-[55px] flex-col items-center justify-center gap-1 rounded-2xl text-zinc-400 transition-colors">
          <i data-lucide="messages-square" class="h-[21px] w-[21px]"></i><span class="text-[11px] font-medium">Фразы</span>
        </a>
        <a data-nav="topics" href="#/topics" class="flex min-h-[55px] flex-col items-center justify-center gap-1 rounded-2xl text-zinc-400 transition-colors">
          <i data-lucide="graduation-cap" class="h-[21px] w-[21px]"></i><span class="text-[11px] font-medium">Темы</span>
        </a>
      </nav>
    </main>
  </div>
  <!-- Import map versions every local module on each page load. HTML can stay cached on GitHub Pages. -->
  <script>
    (() => {
      const version = Date.now().toString(36);
      globalThis.__svenskaVersion = version;
      const files = [
        'js/app.js', 'js/core.js',
        'js/modules/home.js', 'js/modules/topics.js', 'js/modules/collections.js',
        'js/modules/overview.js', 'js/modules/steps.js', 'js/modules/cards.js',
        'js/modules/phrases.js', 'js/modules/dictionary.js', 'js/modules/quiz.js'
      ];
      const imports = {};
      for (const file of files) {
        const url = new URL('./' + file, document.baseURI);
        const fresh = new URL(url);
        fresh.searchParams.set('v', version);
        imports[url.href] = fresh.href;
      }
      const map = document.createElement('script');
      map.type = 'importmap';
      map.textContent = JSON.stringify({imports});
      document.head.appendChild(map);
      import('./js/app.js').catch(error => {
        console.error('Svenska failed to load', error);
        const view = document.querySelector('#view');
        if (view) view.textContent = 'Ошибка загрузки приложения. Обновите страницу.';
      });
    })();
  </script>
</body>
</html>
